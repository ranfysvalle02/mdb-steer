[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdb-steer"
version = "0.3.0"
description = "Learned LLM routing with Ollama and MongoDB Atlas Vector Search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pymongo>=4.7",
]

[project.scripts]
mdb-steer = "mdb_steer.cli:main"

[tool.setuptools]
packages = ["mdb_steer"]
