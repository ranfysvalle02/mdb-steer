[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdb-steer"
version = "0.4.0"
description = "Learned LLM routing with Ollama and MongoDB Atlas Vector Search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pymongo>=4.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# scripts/compare_routellm.py; add "openai" for the mf router
routellm = ["torch", "transformers", "huggingface_hub", "safetensors"]

[project.scripts]
mdb-steer = "mdb_steer.cli:main"

[tool.setuptools]
packages = ["mdb_steer"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) is noise for our same-length comprehensions

[tool.pytest.ini_options]
testpaths = ["tests"]
