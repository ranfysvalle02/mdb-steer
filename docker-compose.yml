services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      # Keep strong, weak and embedding models resident so latency measures compute, not swapping.
      OLLAMA_MAX_LOADED_MODELS: 3
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job: pulls the models the pipeline needs, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: >
      sh -c "ollama pull ${STRONG_MODEL:-llama3.1:8b} &&
             ollama pull ${WEAK_MODEL:-llama3.2:1b} &&
             ollama pull ${EMBED_MODEL:-nomic-embed-text}"
    volumes:
      - ollama-models:/root/.ollama

  app:
    build: .
    depends_on:
      mongodb:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      OLLAMA_URL: http://ollama:11434
      STRONG_MODEL: ${STRONG_MODEL:-llama3.1:8b}
      WEAK_MODEL: ${WEAK_MODEL:-llama3.2:1b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./data:/app/data:ro

volumes:
  mongo-data:
  ollama-models:
